    const GiftContext = createContext(null);

    function GiftProvider({ children }) {
      const [activePage, setActivePage] = useState('home');
      const [cartItems, setCartItems] = useState(INITIAL_CART);
      const [wishlist, setWishlist] = useState(['spotify-1yr']);
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      const [customGift, setCustomGift] = useState({
        designId: 'birthday',
        themeId: 'soft',
        recipient: 'Alex',
        message: 'Happy Birthday! Treat yourself to something cozy.',
        amount: 50
      });

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3000);
      };

      const addToCart = (item) => {
        const newItem = {
          ...item,
          cartInstanceId: `${item.id}-${Date.now()}`
        };
        setCartItems(prev => [...prev, newItem]);
        showToast(`Added "${item.title || item.name}" to cart!`);
      };

      const removeFromCart = (cartInstanceId) => {
        setCartItems(prev => prev.filter(item => (item.cartInstanceId || item.id) !== cartInstanceId));
        showToast('Item removed from cart.', 'info');
      };

      const clearCart = () => setCartItems([]);

      const toggleWishlist = (itemId) => {
        setWishlist(prev => {
          if (prev.includes(itemId)) {
            showToast('Removed from wishlist.', 'info');
            return prev.filter(id => id !== itemId);
          } else {
            showToast('Saved to wishlist!');
            return [...prev, itemId];
          }
        });
      };

      const cartTotal = useMemo(() => {
        return cartItems.reduce((acc, item) => acc + (Number(item.price) || 0), 0);
      }, [cartItems]);

      const selectedDesign = useMemo(() => {
        return CARD_DESIGNS.find(d => d.id === customGift.designId) || CARD_DESIGNS[0];
      }, [customGift.designId]);

      const selectedTheme = useMemo(() => {
        return CARD_THEMES.find(t => t.id === customGift.themeId) || CARD_THEMES[0];
      }, [customGift.themeId]);

      return (
        <GiftContext.Provider value={{
          activePage, setActivePage,
          cartItems, addToCart, removeFromCart, clearCart, cartTotal,
          wishlist, toggleWishlist,
          searchQuery, setSearchQuery,
          customGift, setCustomGift, selectedDesign, selectedTheme,
          toast, showToast
        }}>
          {children}
        </GiftContext.Provider>
      );
    }

    function useGift() {
      return useContext(GiftContext);

                    {cat.icon}
                  </span>
                  <h3 className={`font-quicksand font-bold text-2xl ${cat.textClass} mb-1`}>
                    {cat.title}
                  </h3>
                  <p className={`font-dm-sans text-sm md:text-base ${cat.textClass} opacity-85`}>
                    {cat.description}
                  </p>
                </div>
                <div className="z-10 flex items-center justify-between mt-auto pt-4">
                  <span className={`text-xs font-dm-sans font-semibold uppercase tracking-wider ${cat.textClass} opacity-70 group-hover:opacity-100 transition-opacity`}>
                    Customize for this vibe
                  </span>
                  <div className={`${cat.buttonBg} text-white rounded-full p-3 flex items-center justify-center group-hover:scale-110 group-active:scale-95 transition-transform shadow-sm`}>
                    <span className="material-symbols-outlined text-[20px]">arrow_forward</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </main>
      );
    }

    function CustomizePage() {
      const { customGift, setCustomGift, selectedDesign, selectedTheme, addToCart, setActivePage } = useGift();
      const PRESET_AMOUNTS = [25, 50, 75, 100];

      const handleAddToCart = () => {
        const customizedItem = {
          id: `custom-gift-${Date.now()}`,
          title: `${selectedDesign.name} eGift Card for ${customGift.recipient || 'Someone Special'}`,
          price: customGift.amount || 50,
          description: customGift.message || 'Happy gifting!',
          image: selectedDesign.image,
          isCustom: true,
          recipient: customGift.recipient,
          message: customGift.message,
          theme: selectedTheme.name
        };
        addToCart(customizedItem);
      };

      const handleDirectCheckout = () => {
        handleAddToCart();
        setActivePage('cart');
      };

      return (
        <main className="w-full max-w-7xl mx-auto px-4 md:px-8 py-6 md:py-10 pb-24 flex flex-col lg:flex-row gap-8 lg:gap-12">
          {/* Left: Live Preview */}
          <section className="lg:w-1/2 flex flex-col items-center justify-start lg:sticky lg:top-28 h-fit">
            <div className="w-full max-w-[380px] aspect-[3/4] bg-surface-container-lowest rounded-3xl border-[2px] border-surface-variant shadow-soft overflow-hidden flex flex-col relative transition-all duration-500">
              <div className={`h-1/2 w-full ${selectedTheme.bgCard} relative overflow-hidden transition-colors duration-500`}>
                <img
                  src={selectedDesign.image}
                  alt={selectedDesign.alt}
                  className="w-full h-full object-cover transition-opacity duration-300"
                />
                <div className="absolute top-4 right-4 bg-surface-container-lowest/90 backdrop-blur-md px-3.5 py-1.5 rounded-full shadow-sm">
                  <span className="font-quicksand font-bold text-lg text-primary">
                    ${customGift.amount || 0}
                  </span>
                </div>
              </div>
              <div className="p-6 flex-grow flex flex-col justify-center items-center text-center bg-surface-bright relative z-10">
                <p className="font-quicksand font-bold text-xl text-on-surface mb-2">
                  For: {customGift.recipient || 'Alex'}
                </p>
                <p className="font-dm-sans text-sm text-on-surface-variant italic max-w-xs">
                  "{customGift.message || 'Treat yourself to something cozy!'}"
                </p>
              </div>
              <div className={`absolute inset-0 pointer-events-none border-[6px] rounded-3xl transition-all duration-500 ${selectedTheme.borderColor}`}></div>
            </div>
            <p className="mt-4 text-on-surface-variant font-dm-sans text-xs flex items-center gap-1.5">
              <span className="material-symbols-outlined text-[16px] text-primary">visibility</span>
              Live Preview • Updates in real-time
            </p>
          </section>

          {/* Right: Controls */}
          <section className="lg:w-1/2 flex flex-col gap-8">
            <div>
              <span className="inline-block px-3 py-1 rounded-full bg-primary-container text-on-primary-container text-xs font-dm-sans font-medium mb-2">
                Personalize Your Gift
              </span>
              <h2 className="font-quicksand font-bold text-2xl md:text-3xl text-on-surface">
                Customize E-Gift Card
              </h2>
            </div>

            {/* Design Selector */}
            <div className="bg-surface-container-low/60 rounded-3xl p-6 border border-outline-variant/30">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-quicksand font-bold text-sm">1</div>
                <h3 className="font-quicksand font-bold text-lg text-on-surface">Choose Design</h3>
              </div>
              <div className="grid grid-cols-3 gap-3">
                {CARD_DESIGNS.map((design) => {
                  const isChecked = customGift.designId === design.id;
                  return (
                    <div
                      key={design.id}
                      onClick={() => setCustomGift(prev => ({ ...prev, designId: design.id }))}
                      className={`cursor-pointer group relative rounded-2xl p-2 border-[2px] transition-all text-center ${
                        isChecked ? 'border-primary bg-surface-container-lowest shadow-sm' : 'border-surface-variant bg-surface-container/50 hover:border-primary-container'
                      }`}
                    >
                      <div className="aspect-square rounded-xl overflow-hidden mb-2 bg-surface-container flex items-center justify-center">
                        <img src={design.thumb} alt={design.name} className="w-full h-full object-cover p-2" />
                      </div>
                      <p className="font-dm-sans font-medium text-xs text-on-surface">{design.name}</p>
                      {isChecked && (
                        <div className="absolute -top-1.5 -right-1.5 bg-primary text-white rounded-full w-5 h-5 flex items-center justify-center shadow-sm">
                          <span className="material-symbols-outlined text-[12px] fill">check</span>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Theme Selector */}
            <div className="bg-surface-container-low/60 rounded-3xl p-6 border border-outline-variant/30">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-8 h-8 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center font-quicksand font-bold text-sm">2</div>
                <h3 className="font-quicksand font-bold text-lg text-on-surface">Select Theme Mood</h3>
              </div>
              <div className="flex gap-4">
                {CARD_THEMES.map((theme) => {
                  const isChecked = customGift.themeId === theme.id;
                  return (
                    <div
                      key={theme.id}
                      onClick={() => setCustomGift(prev => ({ ...prev, themeId: theme.id }))}
                      className={`flex-1 cursor-pointer p-4 rounded-2xl border-[2px] text-center transition-all ${
                        isChecked ? 'border-primary bg-surface-container-lowest shadow-sm' : 'border-surface-variant hover:border-primary-container bg-surface-container/40'
                      }`}
                    >
                      <span className={`inline-block w-full h-8 rounded-xl bg-gradient-to-r ${theme.gradientClass} mb-2 shadow-inner`}></span>
                      <span className="font-dm-sans font-medium text-sm text-on-surface">{theme.name}</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Recipient & Message */}
            <div className="bg-surface-container-low/60 rounded-3xl p-6 border border-outline-variant/30">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-8 h-8 rounded-full bg-tertiary-container text-on-tertiary-container flex items-center justify-center font-quicksand font-bold text-sm">3</div>
                <h3 className="font-quicksand font-bold text-lg text-on-surface">Recipient & Message</h3>
              </div>
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-dm-sans font-medium text-on-surface-variant mb-1 ml-1">Recipient Name</label>
                  <input
                    type="text"
                    value={customGift.recipient}
                    onChange={(e) => setCustomGift(prev => ({ ...prev, recipient: e.target.value }))}
                    placeholder="e.g. Alex, Mom, Bestie"
                    className="w-full bg-surface-container-lowest rounded-full px-5 py-3 border border-outline-variant/50 text-sm font-dm-sans focus:outline-none focus:ring-2 focus:ring-primary input-recessed"
                  />
                </div>
                <div>
                  <label className="block text-xs font-dm-sans font-medium text-on-surface-variant mb-1 ml-1">Personalized Note</label>
                  <textarea
                    rows={3}
                    value={customGift.message}
                    onChange={(e) => setCustomGift(prev => ({ ...prev, message: e.target.value }))}
                    placeholder="Write a sweet, thoughtful note..."
                    className="w-full bg-surface-container-lowest rounded-2xl px-5 py-3 border border-outline-variant/50 text-sm font-dm-sans focus:outline-none focus:ring-2 focus:ring-primary input-recessed resize-none"
                  />
                </div>
              </div>
            </div>

            {/* Gift Amount */}
            <div className="bg-surface-container-low/60 rounded-3xl p-6 border border-outline-variant/30">
              <div className="flex items-center gap-3 mb-4">
                <div className="w-8 h-8 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center font-quicksand font-bold text-sm">4</div>
                <h3 className="font-quicksand font-bold text-lg text-on-surface">Gift Amount</h3>
              </div>
              <div className="grid grid-cols-4 gap-2.5 mb-3">
                {PRESET_AMOUNTS.map((amt) => (
                  <button
                    key={amt}
                    type="button"
                    onClick={() => setCustomGift(prev => ({ ...prev, amount: amt }))}
                    className={`py-2.5 rounded-full font-quicksand font-bold text-sm transition-all ${
                      customGift.amount === amt ? 'bg-primary text-white shadow-sm' : 'bg-surface-container-lowest border border-outline-variant/50 text-on-surface hover:bg-surface-container'
                    }`}
                  >
                    ${amt}
                  </button>
                ))}
              </div>
              <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-outline font-bold">$</span>
                <input
                  type="number"
                  min="5"
                  max="1000"
                  value={customGift.amount}
                  onChange={(e) => setCustomGift(prev => ({ ...prev, amount: Number(e.target.value) || 0 }))}
                  placeholder="Or enter custom amount"
                  className="w-full pl-8 pr-4 py-2.5 bg-surface-container-lowest rounded-full border border-outline-variant/50 text-sm font-dm-sans focus:outline-none focus:ring-2 focus:ring-primary input-recessed"
                />
              </div>
            </div>

            {/* CTA Buttons */}
            <div className="flex flex-col sm:flex-row gap-3 pt-2">
              <button
                onClick={handleAddToCart}
                className="flex-1 py-4 px-6 rounded-full bg-surface-container text-on-surface font-dm-sans font-semibold text-sm hover:bg-surface-container-high active:scale-95 transition-all flex items-center justify-center gap-2 border border-outline-variant/50"
              >
                <span className="material-symbols-outlined text-[18px]">add_shopping_cart</span>
                Add to Cart (${customGift.amount || 0})
              </button>
              <button
                onClick={handleDirectCheckout}
                className="flex-1 py-4 px-6 rounded-full bg-primary text-white font-dm-sans font-semibold text-sm hover:opacity-90 active:scale-95 transition-all shadow-soft flex items-center justify-center gap-2"
              >
                <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
                Proceed to Checkout
              </button>
            </div>
          </section>
        </main>
      );
    }

    function CheckoutPage() {
      const { cartItems, removeFromCart, cartTotal, setActivePage, clearCart, showToast } = useGift();
      const [recipientEmail, setRecipientEmail] = useState('');
      const [giftNote, setGiftNote] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [isCompleted, setIsCompleted] = useState(false);

      const handleCheckout = () => {
        if (cartItems.length === 0) {
          showToast('Your cart is empty!', 'info');
          return;
        }
        if (!recipientEmail) {
          showToast('Please enter recipient email', 'info');
          return;
        }
        setIsProcessing(true);
        setTimeout(() => {
          setIsProcessing(false);
          setIsCompleted(true);
          clearCart();
        }, 1200);
      };

      if (isCompleted) {
        return (
          <main className="w-full max-w-2xl mx-auto px-4 py-16 text-center">
            <div className="bg-surface-container-lowest border-[1.5px] border-secondary/30 rounded-[2.5rem] p-8 md:p-12 shadow-soft flex flex-col items-center">
              <div className="w-20 h-20 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mb-6 shadow-sm">
                <span className="material-symbols-outlined text-[40px] fill">celebration</span>
              </div>
              <span className="text-xs font-semibold uppercase tracking-wider text-secondary mb-2">Order Confirmed</span>
              <h2 className="font-quicksand font-bold text-3xl md:text-4xl text-on-surface mb-3">
                Gift Sent Successfully!
              </h2>
              <p className="font-dm-sans text-base text-on-surface-variant max-w-md mb-8">
                Your thoughtful digital gift has been dispatched to <strong>{recipientEmail || 'your friend'}</strong>. A confirmation receipt has been sent to your email.
              </p>
              <div className="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
                <button
                  onClick={() => { setIsCompleted(false); setActivePage('home'); }}
                  className="w-full py-3.5 px-6 rounded-full bg-primary text-white font-dm-sans font-semibold text-sm hover:opacity-90 active:scale-95 transition-all shadow-sm"
                >
                  Back to Home
                </button>
                <button
                  onClick={() => { setIsCompleted(false); setActivePage('categories'); }}
                  className="w-full py-3.5 px-6 rounded-full bg-surface-container text-on-surface font-dm-sans font-semibold text-sm hover:bg-surface-container-high active:scale-95 transition-all"
                >
                  Send Another Gift
                </button>
              </div>
            </div>
          </main>
        );
      }

      return (
        <main className="w-full max-w-3xl mx-auto px-4 md:px-8 py-6 md:py-10 pb-28 flex flex-col gap-8">
          <div className="flex flex-col gap-1 text-center md:text-left">
            <div className="flex items-center justify-center md:justify-start gap-2 mb-1">
              <button
                onClick={() => setActivePage('home')}
                className="text-on-surface-variant hover:text-primary flex items-center text-sm font-dm-sans"
              >
                <span className="material-symbols-outlined text-[18px]">arrow_back</span>
                Back
              </button>
            </div>
            <h2 className="font-quicksand font-bold text-3xl md:text-4xl text-on-surface">Your Gift Cart</h2>
            <p className="font-dm-sans text-base text-on-surface-variant">
              Review your thoughtful selections before sending.
            </p>
          </div>

          <section className="flex flex-col gap-4">
            {cartItems.length === 0 ? (
              <div className="bg-surface-container-lowest border border-outline-variant/40 rounded-3xl p-10 text-center shadow-card">
                <div className="w-16 h-16 rounded-full bg-surface-container mx-auto flex items-center justify-center mb-4 text-outline">
                  <span className="material-symbols-outlined text-[32px]">shopping_bag</span>
                </div>
                <h3 className="font-quicksand font-bold text-xl text-on-surface mb-2">Your cart is currently empty</h3>
                <p className="font-dm-sans text-sm text-on-surface-variant mb-6 max-w-sm mx-auto">
                  Find a special gift, create a custom e-card, or explore gifts for your favorite hobbies.
                </p>
                <button
                  onClick={() => setActivePage('home')}
                  className="px-6 py-3 rounded-full bg-primary text-white font-dm-sans font-medium text-sm hover:opacity-90 active:scale-95 transition-all shadow-sm"
                >
                  Explore Gifts
                </button>
              </div>
            ) : (
              cartItems.map((item) => {
                const key = item.cartInstanceId || item.id;
                return (
                  <div
                    key={key}
                    className="bg-surface-container-lowest border-[1.5px] border-outline-variant/40 rounded-2xl p-5 flex flex-col sm:flex-row gap-4 items-center sm:items-start shadow-card transition-all hover:shadow-soft"
                  >
                    <div className="w-24 h-24 sm:w-28 sm:h-28 rounded-xl flex-shrink-0 overflow-hidden bg-surface-variant flex items-center justify-center">
                      <img src={item.image} alt={item.title} className="w-full h-full object-cover" />
                    </div>
                    <div className="flex-grow flex flex-col gap-1 text-center sm:text-left w-full">
                      <div className="flex justify-between items-start w-full">
                        <h3 className="font-quicksand font-bold text-lg text-on-surface">{item.title}</h3>
                        <p className="font-quicksand font-bold text-xl text-primary">${Number(item.price).toFixed(2)}</p>
                      </div>
                      <p className="font-dm-sans text-xs md:text-sm text-on-surface-variant line-clamp-2">{item.description}</p>
                      {item.recipient && (
                        <p className="text-xs font-dm-sans text-secondary font-medium">Recipient: {item.recipient}</p>
                      )}
                      <div className="mt-2 self-center sm:self-start">
                        <button
                          onClick={() => removeFromCart(key)}
                          className="font-dm-sans text-xs font-semibold text-error hover:opacity-80 transition-opacity flex items-center gap-1"
                        >
                          <span className="material-symbols-outlined text-[16px]">delete</span>
                          Remove
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </section>

          {cartItems.length > 0 && (
            <>
              <div className="flex justify-between items-center py-4 border-t-[1.5px] border-outline-variant/30">
                <span className="font-quicksand font-bold text-lg text-on-surface-variant">Total</span>
                <span className="font-quicksand font-bold text-3xl text-primary">${cartTotal.toFixed(2)}</span>
              </div>

              <section className="bg-surface-container-low rounded-2xl p-6 flex flex-col gap-4 border-[1.5px] border-outline-variant/30 shadow-card">
                <h3 className="font-quicksand font-bold text-xl text-on-surface flex items-center gap-2">
                  <span className="material-symbols-outlined text-primary">mail</span>
                  Delivery Details
                </h3>
                <div className="flex flex-col gap-1">
                  <label className="font-dm-sans text-xs font-medium text-on-surface-variant ml-1" htmlFor="recipient_email">
                    Recipient Email *
                  </label>
                  <input
                    id="recipient_email"
                    type="email"
                    required
                    value={recipientEmail}
                    onChange={(e) => setRecipientEmail(e.target.value)}
                    placeholder="friend@example.com"
                    className="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-full px-5 py-3 font-dm-sans text-sm text-on-surface focus:ring-2 focus:ring-primary focus:outline-none input-recessed transition-all"
                  />
                </div>
                <div className="flex flex-col gap-1">
                  <label className="font-dm-sans text-xs font-medium text-on-surface-variant ml-1" htmlFor="gift_message">
                    Add a personal note (Optional)
                  </label>
                  <textarea
                    id="gift_message"
                    rows={3}
                    value={giftNote}
                    onChange={(e) => setGiftNote(e.target.value)}
                    placeholder="Thinking of you! Enjoy this gift..."
                    className="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-2xl px-5 py-3 font-dm-sans text-sm text-on-surface focus:ring-2 focus:ring-primary focus:outline-none input-recessed transition-all resize-none"
                  />
                </div>
              </section>

              <section className="flex flex-col gap-4">
                <h3 className="font-quicksand font-bold text-xl text-on-surface">Payment Method</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <button
                    type="button"
                    onClick={handleCheckout}
                    disabled={isProcessing}
                    className="bg-on-surface text-surface-container-lowest rounded-full py-3.5 px-6 flex items-center justify-center gap-2 font-quicksand font-bold text-base hover:opacity-90 active:scale-95 transition-all w-full shadow-sm"
                  >
                    <span className="material-symbols-outlined text-[20px] fill">payments</span>
                    Apple Pay
                  </button>
                  <button
                    type="button"
                    onClick={handleCheckout}
                    disabled={isProcessing}
                    className="bg-surface-container-lowest border-[1.5px] border-outline-variant text-on-surface rounded-full py-3.5 px-6 flex items-center justify-center gap-2 font-quicksand font-bold text-base hover:bg-surface-variant active:scale-95 transition-all w-full shadow-sm"
                  >
                    <span className="material-symbols-outlined text-[20px] text-primary">account_balance_wallet</span>
                    Google Pay
                  </button>
                </div>

                <div className="relative flex items-center py-2">
                  <div className="flex-grow border-t-[1.5px] border-outline-variant/30"></div>
                  <span className="flex-shrink-0 mx-4 font-dm-sans text-xs text-on-surface-variant uppercase tracking-wider font-semibold">
                    Or pay with card
                  </span>
                  <div className="flex-grow border-t-[1.5px] border-outline-variant/30"></div>
                </div>

                <button
                  type="button"
                  onClick={handleCheckout}
                  disabled={isProcessing}
                  className="w-full bg-primary-container text-on-primary-container rounded-full py-4 px-8 flex justify-center items-center gap-3 hover:opacity-95 active:scale-[0.98] transition-all shadow-soft"
                >
                  {isProcessing ? (
                    <span className="font-quicksand font-bold text-lg animate-pulse">Sending your gift...</span>
                  ) : (
                    <>
                      <span className="font-quicksand font-bold text-lg">Send Gift • ${cartTotal.toFixed(2)}</span>
                      <span className="material-symbols-outlined text-[22px] fill">favorite</span>
                    </>
                  )}
                </button>
                <p className="text-center font-dm-sans text-xs text-outline">
                  By clicking 'Send Gift', you agree to our Terms of Service & Privacy Policy.
                </p>
              </section>
            </>
          )}
        </main>
      );
    }

    function App() {
      const { activePage } = useGift();
      return (
        <div className="min-h-screen bg-surface text-on-surface flex flex-col font-dm-sans antialiased selection:bg-primary-container selection:text-on-primary-container">
          <Header />
          <Toast />
          <div className="flex-grow">
            {activePage === 'home' && <HomePage />}
            {activePage === 'categories' && <CategoriesPage />}
            {activePage === 'customize' && <CustomizePage />}
            {activePage === 'cart' && <CheckoutPage />}
          </div>
          <BottomNav />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <GiftProvider>
        <App />
      </GiftProvider>
    );
  </script>

  <!-- Transform and Run App -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const code = document.getElementById('app-code').textContent;
        const output = Babel.transform(code, {
          presets: [['react', { runtime: 'classic' }]]
        }).code;
        eval(output);
      } catch (err) {
        console.error('Error compiling React app:', err);
        document.getElementById('root').innerHTML = '<div style="padding:24px;color:#ba1a1a;"><h3>Error loading React app:</h3><pre>' + err.message + '</pre></div>';
      }
    });
  </script>

  <!-- Vite Entrypoint (when running through vite bundler) -->
  <noscript>Please enable JavaScript to view this site.</noscript>
</body>
</html>
